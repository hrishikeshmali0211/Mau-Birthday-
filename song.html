<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aurora Love ✨</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --text: #effffb;
  --muted: #b7d8d7;
  --glass: rgba(10, 28, 44, 0.65);
  --border: rgba(202, 255, 243, 0.2);
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  font-family: Georgia, "Times New Roman", serif;
  color: var(--text);
  background: #061a2b;
}

/* VISIBLE ANIMATED AURORA BACKGROUND */
.aurora {
  position: fixed;
  inset: 0;
  overflow: hidden;
  z-index: 0;
  pointer-events: none;
  background:
    radial-gradient(ellipse at 50% 85%, rgba(15, 105, 110, 0.55) 0%, transparent 55%),
    linear-gradient(180deg, #041323 0%, #082c3b 48%, #061a2b 100%);
}

.light {
  position: absolute;
  width: 150vw;
  height: 65vh;
  min-height: 380px;
  top: -12vh;
  left: -25vw;
  border-radius: 50%;
  filter: blur(28px);
  opacity: 0.88;
  transform-origin: center;
  mix-blend-mode: screen;
  will-change: transform;
}

.light.one {
  background: linear-gradient(105deg,
    transparent 0%,
    rgba(0, 255, 180, 0.05) 12%,
    rgba(0, 255, 180, 0.85) 30%,
    rgba(0, 205, 255, 0.78) 48%,
    rgba(94, 90, 255, 0.48) 65%,
    transparent 82%);
  animation: auroraOne 10s ease-in-out infinite alternate;
}

.light.two {
  top: 8vh;
  left: -35vw;
  opacity: 0.72;
  background: linear-gradient(115deg,
    transparent 5%,
    rgba(95, 255, 180, 0.7) 22%,
    rgba(0, 235, 255, 0.78) 42%,
    rgba(85, 125, 255, 0.65) 60%,
    transparent 80%);
  animation: auroraTwo 13s ease-in-out infinite alternate;
}

.light.three {
  top: 20vh;
  left: -15vw;
  opacity: 0.58;
  background: linear-gradient(110deg,
    transparent 8%,
    rgba(0, 255, 195, 0.65) 28%,
    rgba(76, 255, 220, 0.7) 42%,
    rgba(53, 155, 255, 0.7) 58%,
    transparent 78%);
  animation: auroraThree 16s ease-in-out infinite alternate;
}

@keyframes auroraOne {
  from { transform: translate3d(-12vw, -5vh, 0) rotate(-12deg) scale(0.95); }
  to   { transform: translate3d(18vw, 18vh, 0) rotate(15deg) scale(1.25); }
}

@keyframes auroraTwo {
  from { transform: translate3d(18vw, 4vh, 0) rotate(14deg) scale(1.1); }
  to   { transform: translate3d(-12vw, -10vh, 0) rotate(-17deg) scale(1.35); }
}

@keyframes auroraThree {
  from { transform: translate3d(-8vw, 12vh, 0) rotate(-18deg) scale(1.15); }
  to   { transform: translate3d(22vw, -8vh, 0) rotate(18deg) scale(1.4); }
}

/* A sharper glowing ribbon makes the lights visible even on smaller screens. */
.aurora::before,
.aurora::after {
  content: "";
  position: absolute;
  left: -20%;
  width: 140%;
  height: 38vh;
  min-height: 220px;
  border-radius: 50%;
  filter: blur(22px);
  opacity: 0.72;
  mix-blend-mode: screen;
  will-change: transform;
}

.aurora::before {
  top: 2vh;
  background: linear-gradient(180deg,
    transparent 0%,
    rgba(0, 255, 190, 0.08) 25%,
    rgba(0, 255, 190, 0.68) 48%,
    rgba(0, 190, 255, 0.38) 60%,
    transparent 100%);
  animation: ribbonOne 8s ease-in-out infinite alternate;
}

.aurora::after {
  top: 18vh;
  opacity: 0.52;
  background: linear-gradient(180deg,
    transparent 0%,
    rgba(65, 255, 210, 0.06) 30%,
    rgba(70, 150, 255, 0.58) 52%,
    rgba(125, 80, 255, 0.22) 65%,
    transparent 100%);
  animation: ribbonTwo 11s ease-in-out infinite alternate;
}

@keyframes ribbonOne {
  from { transform: translateX(-12vw) translateY(-3vh) rotate(-5deg) scaleY(0.8); }
  to { transform: translateX(12vw) translateY(10vh) rotate(6deg) scaleY(1.25); }
}

@keyframes ribbonTwo {
  from { transform: translateX(10vw) translateY(5vh) rotate(5deg) scaleY(0.9); }
  to { transform: translateX(-10vw) translateY(-8vh) rotate(-7deg) scaleY(1.3); }
}

/* STARS */
.stars {
  position: absolute;
  inset: 0;
  background-image:
    radial-gradient(1px 1px at 10% 20%, white 90%, transparent),
    radial-gradient(2px 2px at 25% 75%, white 90%, transparent),
    radial-gradient(1px 1px at 38% 35%, white 90%, transparent),
    radial-gradient(2px 2px at 60% 15%, white 90%, transparent),
    radial-gradient(1px 1px at 73% 55%, white 90%, transparent),
    radial-gradient(2px 2px at 88% 30%, white 90%, transparent),
    radial-gradient(1px 1px at 95% 80%, white 90%, transparent),
    radial-gradient(1px 1px at 50% 90%, white 90%, transparent);
  background-size: 100% 100%;
  animation: starTwinkle 5s ease-in-out infinite alternate;
}

@keyframes starTwinkle {
  from { opacity: 0.35; }
  to { opacity: 1; }
}

/* FLOATING PARTICLES */
.particle {
  position: absolute;
  bottom: -15px;
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: #baffed;
  box-shadow: 0 0 12px 3px rgba(96, 255, 214, 0.5);
  animation: particleRise linear infinite;
}

.particle:nth-child(1) { left: 8%; animation-duration: 13s; }
.particle:nth-child(2) { left: 22%; animation-duration: 17s; animation-delay: 2s; }
.particle:nth-child(3) { left: 42%; animation-duration: 15s; animation-delay: 5s; }
.particle:nth-child(4) { left: 58%; animation-duration: 19s; animation-delay: 1s; }
.particle:nth-child(5) { left: 74%; animation-duration: 14s; animation-delay: 4s; }
.particle:nth-child(6) { left: 91%; animation-duration: 18s; animation-delay: 7s; }

@keyframes particleRise {
  0% { transform: translateY(0); opacity: 0; }
  15% { opacity: 0.8; }
  100% { transform: translateY(-110vh); opacity: 0; }
}

/* MAIN SCREEN */
.screen {
  position: relative;
  z-index: 1;
  width: 100%;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.topbar {
  width: 100%;
  padding: 20px 26px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  z-index: 5;
}

.home {
  text-decoration: none;
  color: var(--text);
  padding: 9px 16px;
  border: 1px solid var(--border);
  background: rgba(255,255,255,0.07);
  border-radius: 30px;
  font-size: 13px;
  transition: 0.25s;
}

.home:hover {
  background: rgba(255,255,255,0.16);
}

.top-label {
  font-family: Arial, sans-serif;
  font-size: 11px;
  letter-spacing: 3px;
  color: #b1eee0;
  text-transform: uppercase;
}

.main-area {
  position: relative;
  flex: 1;
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 10px 20px 30px;
}

/* PLAYER */
.player {
  position: relative;
  width: min(390px, 100%);
  padding: 28px 26px;
  border: 1px solid var(--border);
  border-radius: 28px;
  background: var(--glass);
  backdrop-filter: blur(18px);
  box-shadow: 0 20px 70px rgba(0,0,0,0.25);
  text-align: center;
  transition:
    transform 0.55s cubic-bezier(.22,.8,.25,1),
    margin 0.55s ease,
    opacity 0.4s ease;
  z-index: 2;
}

.player-heading {
  font-size: clamp(30px, 5vw, 43px);
  font-weight: normal;
  margin: 0 0 6px;
  letter-spacing: 1px;
  text-shadow: 0 0 24px rgba(105,255,218,0.35);
}

.player-subtitle {
  color: var(--muted);
  font-size: 13px;
  margin-bottom: 22px;
}

/* VISUALIZER */
.visualizer {
  width: 190px;
  height: 190px;
  margin: 0 auto 23px;
  position: relative;
  display: grid;
  place-items: center;
}

.orbit {
  position: absolute;
  inset: 0;
  border: 1px solid rgba(161,255,225,0.35);
  border-radius: 50%;
  animation: orbitSpin 20s linear infinite;
}

.orbit::before {
  content: "";
  position: absolute;
  top: 14px;
  left: 28px;
  width: 8px;
  height: 8px;
  background: #8effd7;
  border-radius: 50%;
  box-shadow: 0 0 15px #8effd7;
}

.orbit.two {
  inset: 15px;
  border-color: rgba(125,208,255,0.35);
  animation-direction: reverse;
  animation-duration: 13s;
}

.orbit.two::before {
  background: #91dfff;
  box-shadow: 0 0 15px #91dfff;
  top: 8px;
  left: 25px;
}

@keyframes orbitSpin {
  to { transform: rotate(360deg); }
}

.disc {
  width: 125px;
  height: 125px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 43px;
  background:
    radial-gradient(circle, #c8fff0 0%, #54c6ba 35%, #164d5d 75%, #092334 100%);
  box-shadow:
    0 0 25px rgba(86,255,217,0.25),
    inset 0 0 20px rgba(255,255,255,0.25);
  border: 1px solid rgba(255,255,255,0.45);
  transition: 0.3s;
}

.disc.playing {
  animation: discPulse 2.2s ease-in-out infinite;
}

@keyframes discPulse {
  0%, 100% {
    transform: scale(1);
    box-shadow: 0 0 22px rgba(86,255,217,0.25);
  }
  50% {
    transform: scale(1.07);
    box-shadow: 0 0 45px rgba(86,255,217,0.55);
  }
}

.song-title {
  font-size: 21px;
  font-weight: normal;
  margin: 0 0 8px;
  overflow-wrap: anywhere;
}

.song-status {
  min-height: 18px;
  color: #b6e8dc;
  font-family: Arial, sans-serif;
  font-size: 11px;
  letter-spacing: 1px;
}

/* PROGRESS */
.progress-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 23px 0 19px;
  color: #b6e8dc;
  font-family: Arial, sans-serif;
  font-size: 10px;
}

input[type="range"] {
  flex: 1;
  min-width: 0;
  accent-color: #8effd7;
  cursor: pointer;
}

/* CONTROLS */
.controls {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 17px;
}

.control {
  width: 44px;
  height: 44px;
  border: 1px solid var(--border);
  background: rgba(255,255,255,0.08);
  color: white;
  border-radius: 50%;
  font-size: 16px;
  cursor: pointer;
  transition: 0.25s;
}

.control:hover {
  background: rgba(255,255,255,0.18);
  transform: scale(1.08);
}

.control.main {
  width: 57px;
  height: 57px;
  background: #a0ffe0;
  color: #073b40;
  border: none;
  font-size: 21px;
  box-shadow: 0 0 25px rgba(111,255,220,0.3);
}

.control.main:hover {
  box-shadow: 0 0 35px rgba(111,255,220,0.55);
}

/* PLAYLIST DRAWER */
.drawer {
  position: absolute;
  top: 10px;
  bottom: 10px;
  right: 20px;
  width: min(360px, calc(100% - 40px));
  border: 1px solid var(--border);
  border-radius: 25px;
  background: rgba(4, 22, 37, 0.82);
  backdrop-filter: blur(22px);
  box-shadow: 0 20px 70px rgba(0,0,0,0.3);
  display: flex;
  flex-direction: column;
  padding: 20px;
  opacity: 0;
  visibility: hidden;
  transform: translateX(35px);
  transition:
    opacity 0.4s ease,
    transform 0.5s cubic-bezier(.22,.8,.25,1),
    visibility 0.4s;
  z-index: 4;
}

.drawer.open {
  opacity: 1;
  visibility: visible;
  transform: translateX(0);
}

.drawer-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding-bottom: 15px;
  border-bottom: 1px solid rgba(255,255,255,0.12);
}

.drawer-header h2 {
  margin: 0;
  font-size: 23px;
  font-weight: normal;
}

.close-drawer {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: rgba(255,255,255,0.08);
  color: white;
  font-size: 18px;
  cursor: pointer;
}

.drawer-subtitle {
  font-family: Arial, sans-serif;
  color: var(--muted);
  font-size: 11px;
  margin: 12px 0;
}

.playlist {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding-right: 5px;
  scrollbar-width: thin;
  scrollbar-color: rgba(151,255,226,0.4) transparent;
}

.song-item {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 13px 11px;
  margin-bottom: 7px;
  border: 1px solid transparent;
  border-radius: 13px;
  background: rgba(255,255,255,0.045);
  color: #eafff9;
  cursor: pointer;
  text-align: left;
  font-family: inherit;
  transition: 0.2s;
}

.song-item:hover {
  background: rgba(255,255,255,0.1);
}

.song-item.active {
  background: rgba(117,255,216,0.12);
  border-color: rgba(117,255,216,0.35);
}

.song-number {
  color: #8bdac8;
  font-family: Arial, sans-serif;
  font-size: 11px;
  min-width: 20px;
}

.song-name {
  flex: 1;
  font-size: 14px;
  overflow-wrap: anywhere;
}

.song-icon {
  color: #9fffe0;
  font-size: 14px;
}

.drawer-footer {
  padding-top: 12px;
  text-align: center;
  color: #9fc8c3;
  font-size: 11px;
}

/* WHEN PLAYLIST IS OPEN */
.main-area.drawer-open .player {
  transform: translateX(-190px);
}

/* MOBILE */
@media (max-width: 700px) {
  .topbar {
    padding: 14px 15px;
  }

  .top-label {
    font-size: 9px;
    letter-spacing: 1.5px;
  }

  .main-area {
    padding: 0 12px 18px;
  }

  .player {
    padding: 22px 17px;
    width: min(360px, 100%);
  }

  .player-heading {
    font-size: 34px;
  }

  .visualizer {
    width: 155px;
    height: 155px;
  }

  .disc {
    width: 105px;
    height: 105px;
  }

  .main-area.drawer-open .player {
    transform: translateX(-110%);
    opacity: 0.25;
  }

  .drawer {
    top: 5px;
    bottom: 5px;
    right: 5px;
    width: calc(100% - 10px);
    z-index: 6;
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>

<body>

<div class="aurora">
  <div class="light one"></div>
  <div class="light two"></div>
  <div class="light three"></div>
  <div class="stars"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
</div>

<div class="screen">

  <div class="topbar">
    <a class="home" href="index.html">← Home</a>
    <div class="top-label">A little music for Mau ✧</div>
  </div>

  <main class="main-area" id="mainArea">

    <section class="player">

      <h1 class="player-heading">Aurora Love</h1>
      <div class="player-subtitle">
        Under the same sky, listening to the same stars ♡
      </div>

      <div class="visualizer">
        <div class="orbit"></div>
        <div class="orbit two"></div>
        <div class="disc" id="disc">♫</div>
      </div>

      <h2 class="song-title" id="currentTitle">Your songs are waiting</h2>
      <div class="song-status" id="status">Finding your playlist…</div>

      <audio id="audio" preload="metadata"></audio>

      <div class="progress-row">
        <span id="currentTime">0:00</span>
        <input type="range" id="progress" min="0" max="100" value="0">
        <span id="duration">0:00</span>
      </div>

      <div class="controls">
        <button class="control" id="prevBtn" aria-label="Previous song">⏮</button>
        <button class="control main" id="playBtn" aria-label="Play">▶</button>
        <button class="control" id="nextBtn" aria-label="Next song">⏭</button>
      </div>

      <div class="extra-controls">
        <button class="playlist-toggle" id="playlistToggle">
          ♪ Our Playlist
        </button>
      </div>

    </section>

    <aside class="drawer" id="drawer">

      <div class="drawer-header">
        <h2>Our Songs ♡</h2>
        <button class="close-drawer" id="closeDrawer" aria-label="Close playlist">×</button>
      </div>

      <p class="drawer-subtitle" id="playlistCount">
        Songs picked with love
      </p>

      <div class="playlist" id="playlist">
        <p>Loading songs…</p>
      </div>

      <div class="drawer-footer">
        Every song reminds me of you ✨
      </div>

    </aside>

  </main>

</div>

<script>
const USERNAME = "hrishikeshmali0211";
const REPOSITORY = "Mau-Birthday-";
const BRANCH = "main";
const MUSIC_FOLDER = "music";

const audio = document.getElementById("audio");
const playlistElement = document.getElementById("playlist");
const currentTitle = document.getElementById("currentTitle");
const statusText = document.getElementById("status");
const playBtn = document.getElementById("playBtn");
const disc = document.getElementById("disc");
const progress = document.getElementById("progress");
const currentTimeElement = document.getElementById("currentTime");
const durationElement = document.getElementById("duration");
const drawer = document.getElementById("drawer");
const mainArea = document.getElementById("mainArea");
const playlistToggle = document.getElementById("playlistToggle");
const closeDrawer = document.getElementById("closeDrawer");
const playlistCount = document.getElementById("playlistCount");

let songs = [];
let currentIndex = 0;

function formatTime(seconds) {
  if (!Number.isFinite(seconds)) return "0:00";

  const minutes = Math.floor(seconds / 60);
  const remainingSeconds = Math.floor(seconds % 60);

  return minutes + ":" + String(remainingSeconds).padStart(2, "0");
}

function displayName(filename) {
  return filename
    .replace(/\.[^/.]+$/, "")
    .replace(/[_]/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

/* PLAYLIST PANEL */
function openPlaylist() {
  drawer.classList.add("open");
  mainArea.classList.add("drawer-open");
  playlistToggle.textContent = "♪ Hide Playlist";
}

function hidePlaylist() {
  drawer.classList.remove("open");
  mainArea.classList.remove("drawer-open");
  playlistToggle.textContent = "♪ Our Playlist";
}

playlistToggle.addEventListener("click", () => {
  if (drawer.classList.contains("open")) {
    hidePlaylist();
  } else {
    openPlaylist();
  }
});

closeDrawer.addEventListener("click", hidePlaylist);

/* RENDER SONG LIST */
function renderPlaylist() {
  playlistElement.innerHTML = "";

  songs.forEach((song, index) => {
    const button = document.createElement("button");

    button.className =
      "song-item" + (index === currentIndex ? " active" : "");

    button.type = "button";

    const number = document.createElement("span");
    number.className = "song-number";
    number.textContent = String(index + 1).padStart(2, "0");

    const name = document.createElement("span");
    name.className = "song-name";
    name.textContent = song.title;

    const icon = document.createElement("span");
    icon.className = "song-icon";
    icon.textContent =
      index === currentIndex && !audio.paused ? "♫" : "▶";

    button.append(number, name, icon);

    button.addEventListener("click", () => {
      playSong(index);
    });

    playlistElement.appendChild(button);
  });
}

/* LOAD AND PLAY SONG */
let playRequestId = 0;

function loadSong(index) {
  if (!songs.length) return;

  currentIndex = (index + songs.length) % songs.length;
  const song = songs[currentIndex];

  audio.pause();
  audio.src = song.url;
  audio.load();

  currentTitle.textContent = song.title;
  statusText.textContent = "Ready when you are ♡";
  progress.value = 0;
  currentTimeElement.textContent = "0:00";
  durationElement.textContent = "0:00";
  renderPlaylist();
}

async function playSong(index) {
  if (!songs.length) return;

  const requestId = ++playRequestId;
  loadSong(index);
  statusText.textContent = "Loading your song… ♡";

  try {
    await new Promise((resolve, reject) => {
      if (audio.readyState >= HTMLMediaElement.HAVE_FUTURE_DATA) {
        resolve();
        return;
      }

      const cleanup = () => {
        audio.removeEventListener("canplay", onReady);
        audio.removeEventListener("error", onError);
      };

      const onReady = () => {
        cleanup();
        resolve();
      };

      const onError = () => {
        cleanup();
        reject(new Error("Audio failed to load"));
      };

      audio.addEventListener("canplay", onReady, { once: true });
      audio.addEventListener("error", onError, { once: true });
    });

    if (requestId !== playRequestId) return;
    await audio.play();
  } catch (error) {
    if (requestId !== playRequestId) return;
    console.error("Unable to play song:", error);
    statusText.textContent = "Couldn't load this song. Try another one ♡";
  }
}

async function togglePlay() {
  if (!songs.length) return;

  if (audio.paused) {
    if (!audio.src) {
      await playSong(currentIndex);
      return;
    }

    try {
      await audio.play();
    } catch (error) {
      statusText.textContent = "Tap play to try again ♡";
    }
  } else {
    audio.pause();
  }
}

/* NEXT AND PREVIOUS */
function nextSong() {
  if (songs.length) {
    playSong((currentIndex + 1) % songs.length);
  }
}

function previousSong() {
  if (!songs.length) return;

  if (audio.currentTime > 3) {
    audio.currentTime = 0;
  } else {
    playSong((currentIndex - 1 + songs.length) % songs.length);
  }
}

/* AUTOMATICALLY LOAD FILES FROM GITHUB MUSIC FOLDER */
async function loadPlaylist() {
  const apiUrl =
    `https://api.github.com/repos/${USERNAME}/${REPOSITORY}/contents/${MUSIC_FOLDER}?ref=${BRANCH}`;

  try {
    const response = await fetch(apiUrl);

    if (!response.ok) {
      throw new Error("Unable to access the music folder.");
    }

    const files = await response.json();

    songs = files
      .filter(file =>
        file.type === "file" &&
        /\.(mp3|m4a|ogg|wav|aac)$/i.test(file.name)
      )
      .sort((a, b) => a.name.localeCompare(b.name))
      .map(file => ({
        filename: file.name,
        title: displayName(file.name),
        url: `${MUSIC_FOLDER}/${encodeURIComponent(file.name)}`
      }));

    if (!songs.length) {
      playlistElement.innerHTML =
        "<p>No audio files found in the music folder.</p>";

      currentTitle.textContent = "No songs found";
      statusText.textContent = "Add your MP3 files to the music folder.";
      playlistCount.textContent = "Your songs will appear here";

      playBtn.disabled = true;
      return;
    }

    playlistCount.textContent =
      songs.length + " songs, picked with love ♡";

    loadSong(0);

    statusText.textContent = songs.length + " songs ready for you ♡";
  } catch (error) {
    console.error(error);

    currentTitle.textContent = "Playlist couldn't load";
    statusText.textContent = "Please check your internet connection.";

    playlistElement.innerHTML =
      "<p>Couldn't load the music folder. Please refresh the page.</p>";
  }
}

/* PLAYER EVENT LISTENERS */
playBtn.addEventListener("click", togglePlay);

document.getElementById("nextBtn").addEventListener("click", nextSong);
document.getElementById("prevBtn").addEventListener("click", previousSong);

audio.addEventListener("play", () => {
  playBtn.textContent = "❚❚";
  disc.classList.add("playing");

  statusText.textContent = "Playing just for you ♡";

  renderPlaylist();
});

audio.addEventListener("pause", () => {
  playBtn.textContent = "▶";
  disc.classList.remove("playing");
  renderPlaylist();
});

/* AUTO-PLAY NEXT SONG */
audio.addEventListener("ended", () => {
  if (!songs.length) return;

  playSong((currentIndex + 1) % songs.length);
});

/* PROGRESS BAR */
audio.addEventListener("timeupdate", () => {
  if (audio.duration) {
    progress.value = (audio.currentTime / audio.duration) * 100;
    currentTimeElement.textContent = formatTime(audio.currentTime);
  }
});

audio.addEventListener("loadedmetadata", () => {
  durationElement.textContent = formatTime(audio.duration);
});

progress.addEventListener("input", () => {
  if (audio.duration) {
    audio.currentTime = (progress.value / 100) * audio.duration;
  }
});

/* INITIALIZE */
loadPlaylist();
</script>

</body>
</html>
