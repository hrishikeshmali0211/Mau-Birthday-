<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday, Mau! 💗</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Georgia, serif;
  background: linear-gradient(135deg, #fff0f5, #ffe0ec, #fff5f8);
  color: #9d174d;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.welcome {
  text-align: center;
  padding: 30px;
  max-width: 850px;
  position: relative;
  z-index: 2;
}

h1 {
  font-size: clamp(2.5rem, 7vw, 5rem);
  margin-bottom: 15px;
}

p {
  font-size: 1.2rem;
  line-height: 1.8;
}

button {
  background: #e91e63;
  color: white;
  border: none;
  border-radius: 35px;
  padding: 17px 35px;
  font-size: 1.1rem;
  cursor: pointer;
  margin-top: 25px;
  box-shadow: 0 8px 25px #e91e6340;
  transition: transform 0.3s;
}

button:hover {
  transform: scale(1.07);
}

.heart {
  position: absolute;
  bottom: -50px;
  color: #ff6b9d;
  animation: float 9s linear infinite;
  opacity: 0.6;
  z-index: 1;
}

@keyframes float {
  0% {
    transform: translateY(0) rotate(0deg);
    opacity: 0;
  }
  20% {
    opacity: 0.7;
  }
  100% {
    transform: translateY(-110vh) rotate(360deg);
    opacity: 0;
  }
}

@media (max-width: 600px) {
  h1 {
    font-size: 2.8rem;
  }

  p {
    font-size: 1rem;
  }
}
</style>
</head>

<body>

<div class="welcome">
  <h1>Happy Birthday, Mau! 💗</h1>

  <p>
    Something special has been made just for you…
    <br>
    A little world filled with love, memories, and surprises.
  </p>

  <button onclick="location.href='gift.html'">
    Open Your Birthday Surprise 🎁
  </button>
</div>

<script>
for (let i = 0; i < 25; i++) {
  const heart = document.createElement("div");
  heart.className = "heart";
  heart.textContent = ["♡", "♥", "💕", "💗"][Math.floor(Math.random() * 4)];

  heart.style.left = Math.random() * 100 + "vw";
  heart.style.fontSize = (15 + Math.random() * 30) + "px";
  heart.style.animationDelay = Math.random() * 8 + "s";
  heart.style.animationDuration = (6 + Math.random() * 8) + "s";

  document.body.appendChild(heart);
}
</script>

</body>
</html>
